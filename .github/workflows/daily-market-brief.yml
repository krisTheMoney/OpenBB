name: 📈 Daglig markedsoppdatering

on:
  schedule:
    # 04:40 UTC mandag til fredag. Den amerikanske børsen stenger 22:00 norsk tid, så
    # rapporten dekker forrige handelsdag. Mandagens rapport dekker fredagens close.
    # Cron følger ikke norsk sommertid: dette er 06:40 norsk tid om sommeren, 05:40
    # om vinteren.
    - cron: "40 4 * * 1-5"
  workflow_dispatch:

# Én kjøring om gangen. Blir en kjøring hengende, skal ikke neste dag skrive over den
# midt i en push til rapportbranchen.
concurrency:
  group: daily-market-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    name: Bygg og publiser oppdateringen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hent koden
        uses: actions/checkout@v6

      - name: Sett opp Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/daily_brief/requirements.txt

      - name: Installer avhengigheter
        run: pip install -r tools/daily_brief/requirements.txt

      - name: Kontroller porteføljen
        run: python tools/daily_brief/run_brief.py --validate

      - name: Bygg oppdateringen
        run: |
          python tools/daily_brief/run_brief.py --out "$RUNNER_TEMP/generated"

      - name: Vis rapporten i kjøringen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/generated/latest.md" ]; then
            cat "$RUNNER_TEMP/generated/latest.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ingen rapport ble generert. Se loggen over." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ta vare på rapporten som artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markedsoppdatering
          path: ${{ runner.temp }}/generated
          if-no-files-found: warn
          retention-days: 30

      - name: Publiser til rapportbranchen
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          BRANCH: market-reports
        run: |
          set -euo pipefail

          target="$RUNNER_TEMP/reports-branch"

          # Rapportbranchen er foreldreløs og inneholder bare rapporter, aldri kode.
          # Første kjøring må derfor opprette den fra bunnen.
          if git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$target" 2>/dev/null; then
            echo "Fortsetter på eksisterende $BRANCH"
          else
            echo "Oppretter $BRANCH"
            mkdir -p "$target"
            git -C "$target" init -q -b "$BRANCH"
            git -C "$target" remote add origin "$REPO_URL"
          fi

          mkdir -p "$target/reports"
          cp "$RUNNER_TEMP"/generated/* "$target/reports/"

          git -C "$target" config user.name "github-actions[bot]"
          git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target" add -A

          if git -C "$target" diff --cached --quiet; then
            echo "Ingen endringer å publisere."
            exit 0
          fi

          git -C "$target" commit -q -m "Markedsoppdatering $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4; do
            if git -C "$target" push -u origin "$BRANCH"; then
              exit 0
            fi
            echo "Push feilet, forsøk $attempt. Prøver igjen."
            sleep $((2 ** attempt))
          done

          echo "Klarte ikke å publisere rapporten." >&2
          exit 1
