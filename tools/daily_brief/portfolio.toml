# Porteføljen som den daglige oppdateringen bygger på.
#
# Oppdatering ved handel: send Claude et nytt skjermbilde fra megler-appen og be om at
# denne filen skrives om. Filen kan også redigeres for hånd i GitHub-webeditoren.
#
# Etter enhver endring, kjør:  python run_brief.py --validate
# Den sjekker at posisjonene pluss kontanter summerer til reported_total_nok.

[meta]
base_currency = "NOK"

# Totalen megleren viste da posisjonene sist ble lest av, og handelsdagen prisene under
# stammer fra. snapshot_date brukes til å hente historisk USDNOK slik at antall aksjer
# kan utledes; se README for hvorfor det er nødvendig.
reported_total_nok = 116404.09
snapshot_date = "2026-08-14"
snapshot_note = "Avlest fra skjermbilde 2026-08-15 kl. 20:42. Prisene er fredagens close."

[cash]
nok = 2498.96

# Hver posisjon:
#   symbol             ticker slik Yahoo Finance kjenner den
#   cost_basis_nok     samlet kostpris i NOK (utledet som verdi minus P/L fra appen)
#   snapshot_price     kurs i USD på snapshot_date
#   snapshot_value_nok posisjonens verdi i NOK på snapshot_date
#   shares             valgfri. Utelates den, utledes antallet fra snapshot + historisk
#                      USDNOK. Legg inn eksakt antall her når du har det, så brukes det
#                      i stedet og utledningen hoppes over.

